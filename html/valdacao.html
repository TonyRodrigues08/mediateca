<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação</title>
    <link rel="stylesheet" href="../css/estilo_validacao.css">
</head>
<body>
    <div class="validacao">
         <a href="Login.html"><img src="../image/logob.png" alt="" width="100px" class="logo"></a>
            <h2>Confirmar o Código</h2>
            <p>Ser-lhe-á enviada, no devido tempo, uma notificaçao de confirmação para o endereço que nos forneceu.
                Agradecemos a sua paciência e confiança.
            </p>
            <br>
            <div class="input_grup">
            <form action="">
            <input type="number" name="numero" id="numero"  placeholder=" " maxlength="6" inputmode="numeric" pattern="[0-9]*"
             autocomplete="one-time-code" required>
            <label for="numero"class="seunome">Digite o numero de confirmação</label>
            <br>
            <button type="submit" class="botao">Confirmar</button> 
        </form>
        </div>
</div>
  
</body>
</html>
