<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mediateca</title>
    <link rel="stylesheet" href="../css/estilo_login.css">
    <link rel="shortcut icon" href="../image/logo.png" type="image/x-icon">
</head>
<body>
<!-- Esqueleto do login -->
    <div class="login">
        <img src="../image/logob.png" alt="" width="100px" class="logo">
        <div class="input_grup">
            
            <input type="text" id="nome" name="nome" placeholder=" ">
            <label for="nome" class="seunome">Nome de utilizador</label>
            <abbr title="Nome do utilizador"><img src="../image/perfil-de-usuario.png" alt="" width="20ppx" class="imaginput"></abbr>
            
            <br>
        </div>
        <div class="input_grup">
            <input type="password" id="senha" name="senha" placeholder=" " min="6" max="16">
            <label for="senha" class="suasenha">Senha</label>
            <abbr title="Mostrar senha"><img src="../image/olho (1).png" alt="Olho fechado" width="20px" id="mudar_senha"class="imag_input"></abbr>
            
        </div>
        <button class="botao" id="botao">Enter</button>
        <a href="">Esqueces-te da palavra-passe?</a>
        <a href="Cadastro.html" class="cadalogo"> <button class="botaoCadastrar">Criar uma conta</button></a>
    </div>
    <script src="../js/animacao_do_login.js"></script>
    <img src="../image/conpany.png" alt="Empresa" class="logoDaEmpresa">
</body>
</html>
